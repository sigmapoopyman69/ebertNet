name: Check ebertNet website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/ebertnet-inline.js").write_text("\\n".join(parser.parts), encoding="utf-8")
          if not parser.parts:
              raise SystemExit("No inline JavaScript found")
          PY
          node --check /tmp/ebertnet-inline.js

      - name: Check homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("index.html")

          if not page.exists():
              raise SystemExit("ERROR: index.html is missing")

          html = page.read_text(encoding="utf-8")

          if not html.strip():
              raise SystemExit("ERROR: index.html is empty")

          if "<html" not in html.lower():
              raise SystemExit("ERROR: HTML document tag is missing")

          print("ebertNet homepage check passed!")
          PY
