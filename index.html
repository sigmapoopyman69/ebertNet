<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10080b">
<title>ebertNet</title>
<style>
:root{color-scheme:dark;--red:#ff334d;--red2:#a70f2b;--glass:rgba(13,10,13,.76);--line:rgba(255,255,255,.11);--muted:#b8aeb2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090709;color:#fff}
body{min-height:100vh;overflow-x:hidden}.scene{position:fixed;inset:0;z-index:0;background:#090709 url("./moon.jpg") center 48%/cover no-repeat;transform:scale(1.015)}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,7,.47),rgba(8,5,8,.38) 40%,rgba(5,4,7,.9)),radial-gradient(ellipse at 50% 42%,transparent 8%,rgba(0,0,0,.3) 78%)}
.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:22px 28px}
.brand-small{font-weight:850;letter-spacing:-.06em;font-size:19px}.brand-small span{color:var(--red)}
.status{font-size:11px;color:#e9dfe2;border:1px solid var(--line);background:#100c0fbb;padding:8px 12px;border-radius:30px;backdrop-filter:blur(14px)}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e64a5d;margin-right:7px;box-shadow:0 0 12px #ff334d}
main{position:relative;z-index:1;min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 20px 110px}
.hero{text-align:center;margin-top:-25px}.logo{font-size:clamp(64px,11vw,112px);line-height:.95;font-weight:900;letter-spacing:-.095em;background:linear-gradient(140deg,#fff 28%,#ffdce0 54%,#ff4259 84%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 34px #f31b3c40)}
.subtitle{margin:17px 0 38px;text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:#e0cbd0}
.search-shell{width:min(690px,100%);padding:7px;border:1px solid rgba(255,255,255,.15);border-radius:21px;background:rgba(12,9,12,.79);box-shadow:0 24px 90px #0009,inset 0 1px #ffffff0c;backdrop-filter:blur(22px)}
.search-form{display:flex;align-items:center;gap:10px}.search-icon{font-size:22px;color:#ff7180;padding:0 7px 0 13px}
#address{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;font-size:15px;padding:16px 3px}
#address::placeholder{color:#a99ca1}
.go{border:0;border-radius:14px;padding:14px 22px;color:white;font-weight:750;background:linear-gradient(135deg,#ff5368,#b30d2b);box-shadow:0 7px 24px #e51b3c35;cursor:pointer;transition:.18s}
.go:hover{filter:brightness(1.12);transform:translateY(-1px)}
.shortcuts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:25px}
.shortcut{border:1px solid var(--line);background:#100c10a8;color:#e8dfe2;padding:10px 14px;border-radius:13px;font-size:12px;cursor:pointer;backdrop-filter:blur(12px);transition:.18s}
.shortcut:hover{border-color:#ff536877;background:#241015}
.notice{margin-top:28px;max-width:570px;text-align:center;color:#c6b9bd;font-size:12px;line-height:1.65}
.notice strong{color:#fff}.footer{position:fixed;z-index:2;bottom:17px;left:0;right:0;text-align:center;color:#a99ba0;font-size:10px;letter-spacing:.16em}
.toast{position:fixed;z-index:5;left:50%;bottom:52px;transform:translateX(-50%);padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:#171014;color:#f5e9ec;font-size:12px;box-shadow:0 12px 40px #0009;display:none;max-width:calc(100vw - 30px);text-align:center}
@media(max-width:560px){.topbar{padding:17px}.search-shell{padding:5px}.search-icon{padding-left:8px}.go{padding:13px 16px}.subtitle{letter-spacing:.17em}.notice{font-size:11px}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<header class="topbar"><div class="brand-small">ebert<span>Net</span></div><div class="status"><i></i>NETWORK SETUP IN PROGRESS</div></header>
<main>
  <section class="hero">
    <div class="logo">ebertNet</div>
    <div class="subtitle">a darker way to explore</div>
    <div class="search-shell">
      <form class="search-form" id="browseForm">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="address" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="Enter a website address..." aria-label="Website address">
        <button class="go" type="submit">Explore ↗</button>
      </form>
    </div>
    <div class="shortcuts">
      <button class="shortcut" data-url="https://example.com">Example</button>
      <button class="shortcut" data-url="https://developer.mozilla.org">MDN Docs</button>
      <button class="shortcut" data-url="https://wikipedia.org">Wikipedia</button>
    </div>
    <p class="notice"><strong>ebertNet is taking shape.</strong><br>This is the homepage prototype. The Epoxy/Wisp proxy connection has not been configured yet; browsing will open a regular browser tab for now.</p>
  </section>
</main>
<div class="footer">EBERTNET <span style="color:#ff5368">/</span> BUILT FOR THE OPEN WEB</div>
<div class="toast" id="toast" role="status"></div>
<script>
const input=document.getElementById('address'),form=document.getElementById('browseForm'),toast=document.getElementById('toast');
function normalize(value){let v=value.trim();if(!v)return '';if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(v)){if(v.includes(' ')||!v.includes('.'))return 'https://www.google.com/search?q='+encodeURIComponent(v);v='https://'+v;}try{const u=new URL(v);if(!['http:','https:'].includes(u.protocol))return '';return u.href;}catch{return '';}}
function browse(value){const url=normalize(value);if(!url){toast.textContent='Enter a valid http:// or https:// address.';toast.style.display='block';return;}window.open(url,'_blank','noopener,noreferrer');}
form.addEventListener('submit',e=>{e.preventDefault();browse(input.value);});
document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>browse(b.dataset.url)));
</script>
</body>
</html>
